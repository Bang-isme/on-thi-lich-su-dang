<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Ôn Thi Lịch Sử Đảng CSVN — Hệ Thống Học Nhanh & Nhớ Lâu (81 Câu)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --bg-elevated: #ffffff;
      --bg-subtle: #f8fafc;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --primary-border: #c7d2fe;

      --success: #10b981;
      --success-dark: #047857;
      --success-soft: #ecfdf5;
      --success-border: #6ee7b7;

      --danger: #ef4444;
      --danger-dark: #b91c1c;
      --danger-soft: #fef2f2;
      --danger-border: #fca5a5;

      --warning: #f59e0b;
      --warning-dark: #b45309;
      --warning-soft: #fffbeb;
      --warning-border: #fde68a;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 18px 36px -8px rgba(15, 23, 42, 0.12);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --bg-elevated: #1e293b;
      --bg-subtle: #0f172a;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #334155;
      --border-strong: #475569;

      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-soft: rgba(99, 102, 241, 0.16);
      --primary-border: rgba(99, 102, 241, 0.4);

      --success-soft: rgba(16, 185, 129, 0.15);
      --success-border: rgba(16, 185, 129, 0.4);
      --success-dark: #34d399;

      --danger-soft: rgba(239, 68, 68, 0.15);
      --danger-border: rgba(239, 68, 68, 0.4);
      --danger-dark: #f87171;

      --warning-soft: rgba(245, 158, 11, 0.15);
      --warning-border: rgba(245, 158, 11, 0.4);
      --warning-dark: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Top App Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    [data-theme="dark"] .topbar {
      background: rgba(15, 23, 42, 0.92);
    }

    .topbar-inner {
      max-width: 1260px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e11d48, #f59e0b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.28);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.02rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Pill Navigation */
    .main-nav {
      display: flex;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: 13px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .nav-pill {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      white-space: nowrap;
    }

    .nav-pill:hover {
      color: var(--text);
    }

    .nav-pill.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.28);
    }

    .nav-count {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 99px;
      background: rgba(0, 0, 0, 0.08);
    }
    [data-theme="dark"] .nav-count {
      background: rgba(255, 255, 255, 0.1);
    }
    .nav-pill.active .nav-count {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      transition: all 0.15s;
      min-height: 38px;
    }

    .icon-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    .main-wrap {
      max-width: 1260px;
      margin: 20px auto 80px;
      padding: 0 20px;
    }

    .tab-section {
      display: none;
    }
    .tab-section.active {
      display: block;
      animation: fadeSlide 0.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Sub-toolbar */
    .subbar {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .seg-group {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: 11px;
      border: 1px solid var(--border);
      gap: 4px;
      flex-wrap: wrap;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      text-align: center;
    }

    .seg-btn.active {
      background: var(--bg-elevated);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      font-weight: 700;
    }

    .subbar-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ==================== SECTION 1: MCQ LAYOUT ==================== */
    .mcq-workspace {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 20px;
      align-items: start;
    }

    /* Focus Card (1 Question at a time) */
    .focus-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 26px;
      box-shadow: var(--shadow-md);
      min-width: 0;
    }

    .focus-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .q-num-pill {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      padding: 5px 12px;
      border-radius: 99px;
      font-weight: 800;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .q-text-large {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 20px;
      color: var(--text);
      word-break: break-word;
    }

    .opt-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-item {
      width: 100%;
      text-align: left;
      background: var(--bg-subtle);
      border: 2px solid var(--border);
      border-radius: 13px;
      padding: 13px 15px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.16s ease;
      line-height: 1.48;
    }

    @media (hover: hover) {
      .opt-item:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
        transform: translateY(-1px);
      }
    }

    .opt-key {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.84rem;
      flex-shrink: 0;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .opt-item.correct {
      background: var(--success-soft);
      border-color: var(--success);
      font-weight: 600;
    }
    .opt-item.correct .opt-key {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .opt-item.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
    }
    .opt-item.wrong .opt-key {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .instant-memory-box {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 13px;
      background: var(--warning-soft);
      border: 1px solid var(--warning-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .memory-chip-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .kw-tag {
      background: var(--primary);
      color: #fff;
      padding: 4px 10px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.83rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .ans-tag {
      background: var(--success);
      color: #fff;
      padding: 4px 10px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.83rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .focus-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Mobile Palette Drawer Toggle (hidden on desktop) */
    .mobile-palette-toggle {
      display: none;
      width: 100%;
      margin-top: 12px;
    }

    /* Right Question Palette */
    .palette-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 82px;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    .p-cell {
      height: 38px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.14s;
      font-family: inherit;
      position: relative;
    }

    .p-cell.current {
      outline: 2.5px solid var(--primary);
      outline-offset: 1px;
    }

    .p-cell.done-ok {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success-dark);
    }

    .p-cell.done-bad {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger-dark);
    }

    .p-cell.starred::after {
      content: "★";
      position: absolute;
      top: -5px;
      right: -3px;
      font-size: 0.68rem;
      color: #f59e0b;
    }

    /* Ultra-Fast Keyword Reflex Table */
    .reflex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 12px;
    }

    .reflex-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }

    .reflex-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .reflex-pair {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ==================== SECTION 2: SHORT ANSWERS (CLOZE & CONDENSED) ==================== */
    .short-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
      gap: 16px;
    }

    .scard {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .scard.mastered {
      border-left: 5px solid var(--success);
    }
    .scard.hard {
      border-left: 5px solid var(--danger);
    }

    .scard-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .scard-q {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--text);
      flex: 1;
      min-width: 0;
    }

    /* Ultra-short Memory Pill Box */
    .ultra-short-box {
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      border-radius: 11px;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .ultra-label {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--primary);
      width: 100%;
      margin-bottom: 2px;
    }

    .pill-kw {
      background: var(--bg-elevated);
      border: 1px solid var(--primary-border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    /* Interactive Cloze Token - Never overflows on short words */
    .cloze-token {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--warning-soft);
      border: 1.5px dashed var(--warning);
      color: transparent;
      border-radius: 6px;
      padding: 2px 10px;
      margin: 2px 2px;
      min-width: 92px;
      min-height: 26px;
      cursor: pointer;
      user-select: none;
      position: relative;
      font-weight: 700;
      vertical-align: middle;
      transition: all 0.15s;
      line-height: 1.4;
    }

    .cloze-token::after {
      content: "👆 Chạm mở";
      color: var(--warning-dark);
      font-size: 0.75rem;
      font-weight: 700;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .cloze-token.revealed {
      display: inline;
      min-width: 0;
      min-height: 0;
      padding: 1px 6px;
      background: var(--success-soft);
      border: 1.5px solid var(--success);
      color: var(--success-dark);
    }
    .cloze-token.revealed::after {
      content: none;
    }

    .full-ans-line {
      font-size: 0.93rem;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      line-height: 1.75;
      word-break: break-word;
    }

    /* 3D Flashcard for Short Answers */
    .fc-stage {
      max-width: 720px;
      margin: 0 auto;
    }

    .fc-card-modern {
      background: var(--bg-elevated);
      border: 2px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 28px 24px;
      box-shadow: var(--shadow-lg);
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ==================== SECTION 3: ESSAYS (SIÊU RÚT GỌN VS ĐẦY ĐỦ) ==================== */
    .essay-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .e-btn {
      background: var(--bg-elevated);
      border: 2px solid var(--border);
      border-radius: 13px;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.16s;
      min-width: 0;
    }

    .e-btn:hover {
      border-color: var(--primary);
    }

    .e-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .e-btn-num {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
    }

    .e-btn-name {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 3px;
      line-height: 1.35;
    }

    /* Mobile Essay Column Switcher (hidden on desktop) */
    .mobile-essay-switcher {
      display: none;
      margin-bottom: 14px;
    }

    /* Comparison Dual Grid for Essays */
    .essay-dual-layout {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 20px;
      align-items: start;
    }

    .essay-pane {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow-md);
      min-width: 0;
    }

    .pane-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .mindmap-branch {
      border-left: 3px solid var(--primary);
      padding-left: 12px;
      margin-bottom: 16px;
    }

    .mindmap-title {
      font-weight: 800;
      font-size: 0.93rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .mini-step {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .mini-step-num {
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .exam-ready-block {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .exam-ready-block.masked .exam-ready-body {
      filter: blur(6px);
      user-select: none;
    }

    .hl {
      background: rgba(245, 158, 11, 0.22);
      color: inherit;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .warning-banner {
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      color: var(--danger-dark);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    /* =========================================================================
       RESPONSIVE BREAKPOINTS (TABLET & MOBILE OPTIMIZATION)
       ========================================================================= */
    @media (max-width: 960px) {
      .mcq-workspace {
        grid-template-columns: 1fr;
      }

      .palette-card {
        position: static;
        display: none;
      }
      .palette-card.mobile-open {
        display: block;
        animation: fadeSlide 0.2s ease;
      }

      .mobile-palette-toggle {
        display: flex;
      }

      .palette-grid {
        grid-template-columns: repeat(9, 1fr);
      }

  { id: 19, q: "Ngày 3-9-1945, Chính phủ lâm thời họp phiên đầu tiên dưới sự chủ trì của Chủ tịch Hồ Chí Minh đã xác định ngay nhiệm vụ lớn trước mắt, gồm những nhiệm vụ nào?", opts: ["Diệt giặc đói", "Diệt giặc dốt", "Diệt giặc ngoại xâm", "Tất cả các phương án đều đúng"], ans: 3, kwQ: "Nhiệm vụ lớn phiên họp Chính phủ đầu tiên (3/9/1945)", kwA: "D. Tất cả đều đúng (Diệt giặc đói + giặc dốt + giặc ngoại xâm)" },
  { id: 20, q: "Quốc hội khóa I đã họp phiên đầu tiên tại Nhà hát lớn Hà Nội vào ngày 2-3-1946 đã nhất trí bầu Ban Thường trực Quốc hội do ai làm Chủ tịch?", opts: ["Trường Chinh", "Phạm Văn Đồng", "Huỳnh Thúc Kháng", "Nguyễn Văn Tố"], ans: 3, kwQ: "Chủ tịch Ban Thường trực Quốc hội khóa I (2/3/1946)", kwA: "D. Nguyễn Văn Tố" },
  { id: 21, q: "Trong cuộc kháng chiến chống Pháp và can thiệp Mỹ Đảng ta đã chủ trương xây dựng và phát triển lực lượng vũ trang nhằm đáp ứng kịp thời yêu cầu của nhiệm vụ chính trị-quân sự của cuộc kháng chiến, gồm những lực lượng nào?", opts: ["Bộ đội chủ lực", "Bộ đội địa phương", "Dân quân du kích", "Tất cả các phương án đều đúng"], ans: 3, kwQ: "Lực lượng vũ trang 3 thứ quân", kwA: "D. Tất cả đều đúng (Chủ lực + Địa phương + Dân quân du kích)" },
  { id: 22, q: "Sau khi miền Bắc được giải phóng, tháng 9/1954 Bộ Chính trị đề ra nhiệm vụ chủ yếu trước mắt của miền Bắc là gì?", opts: ["Hàn gắn vết thương chiến tranh, phục hồi kinh tế quốc dân", "Giảm tô, giảm tức và cải cách ruộng đất", "Đưa miền Bắc tiến lên chủ nghĩa xã hội", "Xây dựng nền văn hóa mới, con người mới"], ans: 0, kwQ: "Nhiệm vụ trước mắt của miền Bắc (9/1954)", kwA: "A. Hàn gắn vết thương chiến tranh, phục hồi kinh tế quốc dân" },
  { id: 23, q: "Nghị quyết Bộ Chính trị, tháng 9-1954, nêu rõ nhiệm vụ cụ thể trước mắt của cách mạng miền Nam là gì?", opts: ["Đấu tranh đòi thi hành Hiệp định", "Chuyển hướng công tác cho phù hợp điều kiện mới", "Tập hợp mọi lực lượng dân tộc, dân chủ, hòa bình, thống nhất, độc lập, đấu tranh", "Tất cả các phương án đều đúng"], ans: 3, kwQ: "Nhiệm vụ trước mắt của miền Nam (9/1954)", kwA: "D. Tất cả đều đúng (Đòi thi hành Hiệp định + Chuyển hướng + Tập hợp lực lượng)" },
  { id: 24, q: "Từ thắng lợi của phong trào Đồng khởi, ngày 20/12/1960, tại xã Tân Lập (Tây Ninh), Mặt trận Dân tộc giải phóng miền Nam Việt Nam được thành lập, do ai làm chủ tịch?", opts: ["Nguyễn Thị Bình", "Nguyễn Thị Định", "Huỳnh Tấn Phát", "Nguyễn Hữu Thọ"], ans: 3, kwQ: "Chủ tịch Mặt trận Dân tộc giải phóng miền Nam (20/12/1960)", kwA: "D. Nguyễn Hữu Thọ" },
  { id: 25, q: "Đại hội đại biểu toàn quốc lần thứ III của Đảng họp tại Thủ đô Hà Nội, vào tháng năm nào?", opts: ["Tháng 8 năm 1960", "Tháng 9 năm 1960", "Tháng 10 năm 1960", "Tháng 11 năm 1960"], ans: 1, kwQ: "Thời gian họp Đại hội III của Đảng", kwA: "B. Tháng 9 năm 1960" },
  { id: 26, q: "Trận “Điện Biên Phủ trên không”, đánh bại hoàn toàn cuộc tập kích chiến lược bằng máy bay B52 của Mỹ vào Hà Nội và Hải Phòng, diễn ra thời gian nào?", opts: ["Từ 18 đến ngày 30 tháng 12 năm 1972", "Từ 18 đến ngày 24 tháng 12 năm 1972", "Từ 18 đến ngày 26 tháng 12 năm 1972", "Từ 18 đến ngày 28 tháng 12 năm 1972"], ans: 0, kwQ: "Thời gian trận Điện Biên Phủ trên không", kwA: "A. Từ 18 đến ngày 30/12/1972 (12 ngày đêm)" },
  { id: 27, q: "Cuộc đấu tranh ngoại giao trên bàn Hội nghị Paris với việc ký kết “Hiệp định về chấm dứt chiến tranh, lập lại hòa bình ở Việt Nam, kết thúc vào ngày, tháng, năm nào?", opts: ["Ngày 27 tháng 1 năm 1973", "Ngày 28 tháng 1 năm 1973", "Ngày 29 tháng 1 năm 1973", "Ngày 30 tháng 1 năm 1973"], ans: 0, kwQ: "Ngày ký kết Hiệp định Paris", kwA: "A. Ngày 27/01/1973" },
  { id: 28, q: "Cuộc Tổng tiến công và nổi dậy mùa Xuân 1975 bắt đầu bằng chiến dịch nào?", opts: ["Chiến dịch giải phóng Phước Long", "Chiến dịch tiến công giải phóng thành phố Đà Nẵng", "Chiến dịch Tây Nguyên", "Chiến dịch tiến công giải phóng Huế"], ans: 2, kwQ: "Chiến dịch mở đầu Tổng tiến công Xuân 1975", kwA: "C. Chiến dịch Tây Nguyên" },
  { id: 29, q: "Chiến dịch Hồ Chí Minh giải phóng Sài Gòn-Gia Định bắt đầu vào ngày, tháng, năm nào?", opts: ["Ngày 25 tháng 4 năm 1975", "Ngày 26 tháng 4 năm 1975", "Ngày 27 tháng 4 năm 1975", "Ngày 28 tháng 4 năm 1975"], ans: 1, kwQ: "Ngày BẮT ĐẦU Chiến dịch Hồ Chí Minh", kwA: "B. Ngày 26/4/1975" },
  { id: 30, q: "Cuộc tổng tiến công và nổi dậy Xuân 1975 đã toàn thắng, kết thúc vào ngày, tháng, năm nào?", opts: ["Ngày 27 tháng 4 năm 1975", "Ngày 28 tháng 4 năm 1975", "Ngày 29 tháng 4 năm 1975", "Ngày 30 tháng 4 năm 1975"], ans: 3, kwQ: "Ngày KẾT THÚC toàn thắng Xuân 1975", kwA: "D. Ngày 30/4/1975" },
  { id: 31, q: "Từ ngày 24 tháng 6 đến ngày 3 tháng 7 năm 1976, kỳ họp thứ nhất của Quốc hội nước Việt Nam thống nhất đã họp tại Thủ đô Hà Nội đã quyết định những vấn đề gì?", opts: ["Đặt tên nước ta là nước Cộng hoà Xã hội chủ nghĩa Việt Nam, Quốc kỳ nền đỏ sao vàng 5 cánh, Thủ đô là Hà Nội, Quốc ca là bài Tiến quân ca, Quốc huy mang dòng chữ Cộng hòa Xã hội chủ nghĩa Việt Nam", "Thành phố Sài Gòn đổi tên là Thành phố Hồ Chí Minh", "Quốc hội đã bầu Tôn Đức Thắng làm Chủ tịch nước; Nguyễn Lương Bằng, Nguyễn Hữu Thọ làm Phó Chủ tịch nước; Trường Chinh làm Chủ tịch Quốc hội và Phạm Văn Đồng làm Thủ tướng Chính phủ nước Cộng hòa Xã hội chủ nghĩa Việt Nam. Quốc hội đã thành lập Ủy ban dự thảo Hiến pháp mới", "Tất cả các phương án đều đúng"], ans: 3, kwQ: "Kỳ họp thứ nhất Quốc hội thống nhất (6-7/1976)", kwA: "D. Tất cả đều đúng" },
  { id: 32, q: "Đại hội lần thứ mấy của Đảng là đại hội toàn thắng của sự nghiệp giải phóng dân tộc, thống nhất Tổ quốc, khẳng định và xác định đường lối đưa cả nước tiến lên chủ nghĩa xã hội?", opts: ["Đại hội lần thứ IV", "Đại hội lần thứ V", "Đại hội lần thứ VI", "Đại hội lần thứ VII"], ans: 0, kwQ: "Đại hội toàn thắng GPDT, đưa cả nước lên CNXH", kwA: "A. Đại hội lần thứ IV (1976)" },
  { id: 33, q: "Đại hội lần thứ mấy của Đảng xác định cách mạng Việt Nam có hai nhiệm vụ chiến lược là: xây dựng thành công chủ nghĩa xã hội và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa. Hai nhiệm vụ chiến lược có quan hệ mật thiết với nhau?", opts: ["Đại hội lần thứ IV", "Đại hội lần thứ V", "Đại hội lần thứ VI", "Đại hội lần thứ VII"], ans: 1, kwQ: "Đại hội xác định 2 nhiệm vụ chiến lược (Xây dựng & Bảo vệ)", kwA: "B. Đại hội lần thứ V (1982)" },
  { id: 34, q: "Đại hội nào xác định quan điểm mới nổi bật cho phép đảng viên làm kinh tế tư nhân, kể cả tư bản tư nhân nhưng yêu cầu phải tuân thủ Điều lệ Đảng, nghị quyết của Đảng và quy định của pháp luật Nhà nước đồng thời nêu cao tính tiền phong gương mẫu của người đảng viên?", opts: ["Đại hội lần thứ IX", "Đại hội lần thứ X", "Đại hội lần thứ XI", "Đại hội lần thứ XII"], ans: 1, kwQ: "Cho phép đảng viên làm kinh tế tư nhân", kwA: "B. Đại hội lần thứ X (2006)" },
  { id: 35, q: "Vấn đề trọng tâm trong xây dựng văn hóa được Hội nghị Trung ương 9 (khóa XI) xác định là gì?", opts: ["Xây dựng lối sống \"Mỗi người vì mọi người, mọi người vì mỗi người\"; hình thành lối sống có ý thức tự trọng, tự chủ, sống và làm việc theo Hiến pháp và pháp luật", "Xây dựng nền văn hoá Việt Nam tiên tiến, đậm đà bản sắc dân tộc, thống nhất trong đa dạng của cộng đồng các dân tộc Việt Nam", "Chăm lo xây dựng con người có nhân cách, lối sống tốt đẹp, với các đặc tính cơ bản: yêu nước, nhân ái, nghĩa tình, trung thực, đoàn kết, cần cù, sáng tạo", "Giáo dục nghệ thuật, nâng cao năng lực cảm thụ thẩm mỹ cho nhân dân, đặc biệt là thanh, thiếu niên"], ans: 2, kwQ: "Trọng tâm xây dựng văn hóa (TW 9 khóa XI)", kwA: "C. Chăm lo xây dựng con người có nhân cách, lối sống tốt đẹp..." },
  { id: 36, q: "Thế nào là văn hóa tiên tiến theo tinh thần Nghị quyết Hội nghị Trung ương IX (khóa XI)?", opts: ["Văn hóa Tiên tiến là yêu nước và tiến bộ với nội dung cốt lõi là lý tưởng độc lập dân tộc và chủ nghĩa xã hội theo chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, nhằm mục tiêu tất cả vì con người", "Là những giá trị văn hoá truyền thống bền vững của cộng đồng các dân tộc Việt Nam được vun đắp qua lịch sử hàng ngàn năm đấu tranh dựng nước và giữ nước", "Đó là lòng nhân ái, khoan dung trọng tình nghĩa, đạo lý", "Là đức tính cần cù, sáng tạo trong lao động"], ans: 0, kwQ: "Khái niệm Văn hóa Tiên tiến (TW 9 khóa XI)", kwA: "A. Là yêu nước và tiến bộ với nội dung cốt lõi là lý tưởng ĐLDT và CNXH..." },
  { id: 37, q: "Vai trò của đội ngũ trí thức trong xây dựng và phát triển văn hóa hiện nay, được Hội nghị Trung ương 9 (khóa XI) xác định là gì?", opts: ["Cùng với giai cấp công nhân, nông dân, trí thức có vai trò quan trọng là nền tảng của sự nghiệp xây dựng và phát triển văn hóa dưới sự lãnh đạo của Đảng, quản lý của Nhà nước", "Tham gia sự nghiệp xây dựng và phát triển nền văn hoá nước nhà", "Đi đầu trong xây dựng và phát triển văn hóa, con người Việt Nam", "Góp phần giáo dục, rèn luyện con người về nhân cách, lối sống"], ans: 0, kwQ: "Vai trò đội ngũ trí thức trong văn hóa (TW 9 khóa XI)", kwA: "A. Cùng với công nhân, nông dân, trí thức có vai trò quan trọng là nền tảng..." },
  { id: 38, q: "Nguyên tắc cơ bản trong thực hiện chính sách đối ngoại của Đảng ta được Hội nghị Trung ương 8 (khóa XI) xác định là gì?", opts: ["Nắm vững hai mặt hợp tác và đấu tranh trong quan hệ quốc tế", "Tôn trọng độc lập chủ quyền không can thiệp vào công việc nội bộ của nhau", "Thúc đẩy hợp tác, cân bằng lợi ích", "Chủ động và tích cực hội nhập quốc tế; là bạn, là đối tác tin cậy và thành viên có trách nhiệm của cộng đồng quốc tế"], ans: 0, kwQ: "Nguyên tắc đối ngoại (TW 8 khóa XI)", kwA: "A. Nắm vững hai mặt hợp tác và đấu tranh trong quan hệ quốc tế" },
  { id: 39, q: "Trong chiến lược phát triển kinh tế-xã hội 2011-2020, Đại hội XI nhấn mạnh ba đột phá chiến lược, gồm những chiến lược nào?", opts: ["Hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa, trọng tâm là tạo lập môi trường cạnh tranh bình đẳng và cải cách hành chính", "Phát triển nhanh nguồn nhân lực, nhất là nguồn nhân lực chất lượng cao, tập trung vào việc đổi mới căn bản và toàn diện nền giáo dục quốc dân; gắn kết chặt chẽ phát triển nguồn nhân lực với phát triển và ứng dụng khoa học, công nghệ", "Xây dựng hệ thống kết cấu hạ tầng đồng bộ, với một số công trình hiện đại, tập trung vào hệ thống giao thông và hạ tầng đô thị lớn", "Tất cả các phương án đều đúng"], ans: 3, kwQ: "Ba đột phá chiến lược Đại hội XI", kwA: "D. Tất cả đều đúng (Thể chế + Nhân lực + Hạ tầng)" },
  { id: 40, q: "Theo quan điểm Đại hội XII của Đảng, để tiếp tục đẩy mạnh thực hiện mô hình công nghiệp hóa, hiện đại hóa trong điều kiện phát triển kinh tế thị trường định hướng xã hội chủ nghĩa và hội nhập quốc tế gắn với phát triển kinh tế tri thức, Đảng ta xác định cần lấy những yếu tố nào làm động lực chủ yếu?", opts: ["Nguồn nhân lực chất lượng cao", "Khoa học và công nghệ", "Khoa học, công nghệ, tri thức và nguồn nhân lực chất lượng cao", "Nguồn lực về tài chính"], ans: 2, kwQ: "Động lực chủ yếu CNH-HĐH gắn KT tri thức (ĐH XII)", kwA: "C. Khoa học, công nghệ, tri thức và nguồn nhân lực chất lượng cao" },
  { id: 41, q: "Mục đích nền kinh tế thị trường định hướng xã hội chủ nghĩa ở nước ta do Đại hội XII của Đảng xác định?", opts: ["Phát triển nền kinh tế với nhiều hình thức sở hữu, nhiều thành phần kinh tế nhằm giải phóng mọi tiềm năng trong mọi thành phần kinh tế", "Nhằm thực hiện \"dân giàu, nước mạnh, dân chủ, công bằng, văn minh\"; giải phóng mạnh mẽ lực lượng sản xuất, không ngừng nâng cao đời sống nhân dân", "Phát huy vai trò làm chủ xã hội của nhân dân, bảo đảm vai trò quản lý, điều tiết nền kinh tế của Nhà nước pháp quyền xã hội chủ nghĩa dưới sự lãnh đạo của Đảng.", "Phát huy vai trò làm chủ xã hội của nhân dân."], ans: 1, kwQ: "Mục đích KTTT định hướng XHCN (ĐH XII)", kwA: "B. Thực hiện 'dân giàu, nước mạnh, dân chủ, công bằng, văn minh'; giải phóng LLSX..." },

// ============================================================================
// APP STATE & STORAGE
// ============================================================================
const STORE_KEY = "lsd_study_state_v1";
let state = {
  mcqAnswers: {},
  mcqStarred: {},
  shortStatus: {},
  essayRead: {},
  theme: 'light',
  mcqView: 'focus',
  mcqIndex: 0,
  mcqOrder: mcqList.map(q => q.id),
  mobilePaletteOpen: false,
  shortView: 'cloze',
  fcShortIdx: 0,
  fcShortFlipped: false,
  allClozeOpen: false,
  essayId: 76,
  maskEssay: false,
  essayMobileCol: 'both' // 'both' | 'mindmap' | 'text'
};

function initApp() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state.mcqAnswers = p.mcqAnswers || {};
      state.mcqStarred = p.mcqStarred || {};
      state.shortStatus = p.shortStatus || {};
      state.essayRead = p.essayRead || {};
      state.theme = p.theme || 'light';
    }
  } catch (e) {}

  applyThemeUI();
  updateStats();
  renderMcqTab();
  renderShortTab();
  renderEssayTab();
  setupTouchSwipe();
}

function saveApp() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      mcqAnswers: state.mcqAnswers,
      mcqStarred: state.mcqStarred,
      shortStatus: state.shortStatus,
      essayRead: state.essayRead,
      theme: state.theme
    }));
  } catch (e) {}
  updateStats();
}

function applyThemeUI() {
  const icon = document.getElementById('theme-icon');
  const text = document.getElementById('theme-text');
  if (state.theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    if (icon) icon.textContent = '☀️';
    if (text) text.textContent = 'Giao diện sáng';
  } else {
    document.documentElement.removeAttribute('data-theme');
    if (icon) icon.textContent = '🌙';
    if (text) text.textContent = 'Giao diện tối';
  }
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyThemeUI();
  saveApp();
}

function updateStats() {
  const okMcq = mcqList.filter(q => state.mcqAnswers[q.id] === q.ans).length;
  const okShort = shortList.filter(s => state.shortStatus[s.id] === 'mastered').length;
  const okEssay = essayList.filter(e => state.essayRead[e.id]).length;

  document.getElementById('nav-stat-mcq').textContent = `${okMcq}/45`;
  document.getElementById('nav-stat-short').textContent = `${okShort}/30`;
  document.getElementById('nav-stat-essay').textContent = `${okEssay}/6`;

  const palSum = document.getElementById('palette-summary');
  if (palSum) palSum.textContent = `${okMcq}/45 câu đúng`;
}

function switchTab(tab, btn) {
  document.querySelectorAll('.nav-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================================
// PHẦN 1: TRẮC NGHIỆM (CHẾ ĐỘ TẬP TRUNG + BẢNG PHẢN XẠ 3 GIÂY + DANH SÁCH)
// ============================================================================
function getFilteredMcqIds() {
  const f = document.getElementById('mcq-filter').value;
  return state.mcqOrder.filter(id => {
    const q = mcqList.find(x => x.id === id);
    const ua = state.mcqAnswers[id];
    if (f === 'wrong') return ua !== undefined && ua !== q.ans;
    if (f === 'unanswered') return ua === undefined;
    if (f === 'starred') return !!state.mcqStarred[id];
    return true;
  });
}

function setMcqView(v) {
  state.mcqView = v;
  document.getElementById('mcq-view-focus').classList.toggle('active', v === 'focus');
  document.getElementById('mcq-view-reflex').classList.toggle('active', v === 'reflex');
  document.getElementById('mcq-view-list').classList.toggle('active', v === 'list');

  document.getElementById('mcq-focus-layout').style.display = (v === 'focus') ? 'grid' : 'none';
  document.getElementById('mcq-reflex-layout').style.display = (v === 'reflex') ? 'grid' : 'none';
  document.getElementById('mcq-list-layout').style.display = (v === 'list') ? 'flex' : 'none';

  renderMcqTab();
}

function toggleMobilePalette() {
  state.mobilePaletteOpen = !state.mobilePaletteOpen;
  const pal = document.getElementById('mcq-palette-card');
  const btn = document.getElementById('btn-mobile-palette');
  pal.classList.toggle('mobile-open', state.mobilePaletteOpen);
  btn.textContent = state.mobilePaletteOpen
    ? '🔼 Thu gọn Bản đồ 45 câu hỏi'
    : '🗺️ Mở Bản đồ 45 câu hỏi (Chọn nhanh câu)';
}

function applyMcqFilter() {
  state.mcqIndex = 0;
  renderMcqTab();
}

function shuffleMcqQuestions() {
  state.mcqOrder = [...state.mcqOrder].sort(() => Math.random() - 0.5);
  state.mcqIndex = 0;
  renderMcqTab();
}

function resetMcq() {
  if (!confirm("Làm lại toàn bộ 45 câu trắc nghiệm từ đầu?")) return;
  state.mcqAnswers = {};
  state.mcqIndex = 0;
  saveApp();
  renderMcqTab();
}

function renderMcqTab() {
  if (state.mcqView === 'focus') {
    renderMcqFocus();
    renderMcqPalette();
  } else if (state.mcqView === 'reflex') {
    renderMcqReflex();
  } else {
    renderMcqListAll();
  }
}

function renderMcqFocus() {
  const ids = getFilteredMcqIds();
  const box = document.getElementById('mcq-focus-box');

  if (ids.length === 0) {
    box.innerHTML = `<div style="text-align:center; padding:32px 16px;">
      <h3>🎉 Không có câu hỏi nào trong mục lọc này!</h3>
      <p style="color:var(--text-muted); margin-top:8px;">Hãy chọn lại bộ lọc "Tất cả (45 câu)" để tiếp tục.</p>
    </div>`;
    return;
  }

  if (state.mcqIndex >= ids.length) state.mcqIndex = 0;
  if (state.mcqIndex < 0) state.mcqIndex = ids.length - 1;

  const qId = ids[state.mcqIndex];
  const q = mcqList.find(x => x.id === qId);
  const ua = state.mcqAnswers[q.id];
  const answered = ua !== undefined;
  const starred = !!state.mcqStarred[q.id];
  const letters = ['A', 'B', 'C', 'D'];

  box.innerHTML = `
    <div class="focus-top">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="q-num-pill">Câu ${q.id} / 45</span>
        <span style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">(${state.mcqIndex + 1}/${ids.length})</span>
      </div>
      <button class="icon-btn" style="padding:6px 10px; font-size:0.8rem; ${starred ? 'border-color:#f59e0b; color:#d97706;' : ''}" onclick="toggleStar(${q.id})">
        ${starred ? '⭐ Đã lưu' : '☆ Lưu câu khó'}
      </button>
    </div>

    <div class="q-text-large">${q.q}</div>

    <div class="opt-grid">
      ${q.opts.map((opt, idx) => {
        let cls = 'opt-item';
        if (answered) {
          if (idx === q.ans) cls += ' correct';
          else if (idx === ua && ua !== q.ans) cls += ' wrong';
        }
        return `<button class="${cls}" onclick="pickMcq(${q.id}, ${idx})">
          <span class="opt-key">${letters[idx]}</span>
          <span style="flex:1;">${opt}</span>
        </button>`;
      }).join('')}
    </div>

    ${answered ? `
      <div class="instant-memory-box">
        <div style="font-size:0.75rem; font-weight:800; color:var(--warning-dark); text-transform:uppercase;">
          ⚡ MẸO NHỚ 3 GIÂY:
        </div>
        <div class="memory-chip-row">
          <span class="kw-tag">🔍 ${q.kwQ}</span>
          <strong>➔</strong>
          <span class="ans-tag">✅ ${q.kwA}</span>
        </div>
      </div>
    ` : ''}

    <div class="focus-footer">
      <button class="icon-btn" onclick="stepMcq(-1)">⬅️ Câu trước</button>
      <div class="footer-status" style="font-size:0.82rem; color:var(--text-muted); font-weight:600;">
        ${answered ? (ua === q.ans ? '🟢 Chính xác!' : '🔴 Chưa đúng — Xem mẹo nhớ ở trên!') : '⚪ Chạm chọn 1 đáp án'}
      </div>
      <button class="icon-btn" style="background:var(--primary); color:#fff; border-color:var(--primary);" onclick="stepMcq(1)">Câu tiếp ➡️</button>
    </div>
  `;
}

function renderMcqPalette() {
  const ids = getFilteredMcqIds();
  const currentId = ids[state.mcqIndex];
  const grid = document.getElementById('mcq-palette-grid');

  grid.innerHTML = mcqList.map(q => {
    const ua = state.mcqAnswers[q.id];
    let cls = 'p-cell';
    if (q.id === currentId) cls += ' current';
    if (ua !== undefined) {
      cls += (ua === q.ans) ? ' done-ok' : ' done-bad';
    }
    if (state.mcqStarred[q.id]) cls += ' starred';
    return `<button class="${cls}" onclick="jumpToMcq(${q.id})">${q.id}</button>`;
  }).join('');
}

function pickMcq(qId, idx) {
  state.mcqAnswers[qId] = idx;
  saveApp();
  renderMcqTab();
}

function toggleStar(qId) {
  if (state.mcqStarred[qId]) delete state.mcqStarred[qId];
  else state.mcqStarred[qId] = true;
  saveApp();
  renderMcqTab();
}

function stepMcq(delta) {
  state.mcqIndex += delta;
  renderMcqFocus();
  renderMcqPalette();
}

function jumpToMcq(qId) {
  const fSelect = document.getElementById('mcq-filter');
  const ids = getFilteredMcqIds();
  let pos = ids.indexOf(qId);
  if (pos === -1) {
    fSelect.value = 'all';
    pos = state.mcqOrder.indexOf(qId);
  }
  state.mcqIndex = pos;
  renderMcqFocus();
  renderMcqPalette();
  if (window.innerWidth <= 960) {
    document.getElementById('mcq-focus-box').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function renderMcqReflex() {
  const ids = getFilteredMcqIds();
  const container = document.getElementById('mcq-reflex-layout');
  container.innerHTML = ids.map(id => {
    const q = mcqList.find(x => x.id === id);
    return `<div class="reflex-card">
      <div class="reflex-top">
        <span>CÂU ${q.id}</span>
        <span>Mẹo nhớ 3 giây</span>
      </div>
      <div class="reflex-pair">
        <span class="kw-tag">${q.kwQ}</span>
        <span>➔</span>
        <span class="ans-tag">${q.kwA}</span>
      </div>
      <div style="font-size:0.83rem; color:var(--text-muted); border-top:1px dashed var(--border); padding-top:6px;">
        <strong>Câu hỏi gốc:</strong> ${q.q}
      </div>
    </div>`;
  }).join('');
}

function renderMcqListAll() {
  const ids = getFilteredMcqIds();
  const letters = ['A', 'B', 'C', 'D'];
  const container = document.getElementById('mcq-list-layout');
  container.innerHTML = ids.map(id => {
    const q = mcqList.find(x => x.id === id);
    const ua = state.mcqAnswers[q.id];
    const answered = ua !== undefined;
    return `<div class="focus-card" style="padding:18px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
        <span class="q-num-pill">Câu ${q.id}</span>
        <span style="font-size:0.8rem; font-weight:700; color:var(--primary);">⚡ ${q.kwQ} ➔ ${q.kwA}</span>
      </div>
      <div style="font-weight:700; font-size:1rem; margin-bottom:12px;">${q.q}</div>
      <div class="opt-grid">
        ${q.opts.map((opt, idx) => {
          let cls = 'opt-item';
          if (answered) {
            if (idx === q.ans) cls += ' correct';
            else if (idx === ua && ua !== q.ans) cls += ' wrong';
          }
          return `<button class="${cls}" style="padding:10px 12px;" onclick="pickMcq(${q.id}, ${idx})">
            <span class="opt-key">${letters[idx]}</span>
            <span style="flex:1;">${opt}</span>
          </button>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

// Keyboard shortcuts for Desktop Focus Mode
window.addEventListener('keydown', (e) => {
  const activeMcq = document.getElementById('tab-mcq').classList.contains('active');
  if (!activeMcq || state.mcqView !== 'focus') return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

  const ids = getFilteredMcqIds();
  if (!ids.length) return;
  const qId = ids[state.mcqIndex];

  if (['1', 'a', 'A'].includes(e.key)) pickMcq(qId, 0);
  if (['2', 'b', 'B'].includes(e.key)) pickMcq(qId, 1);
  if (['3', 'c', 'C'].includes(e.key)) pickMcq(qId, 2);
  if (['4', 'd', 'D'].includes(e.key)) pickMcq(qId, 3);
  if (e.key === 'ArrowRight') stepMcq(1);
  if (e.key === 'ArrowLeft') stepMcq(-1);
});

// Touch Swipe Left/Right for Mobile Focus Mode & Flashcards
function setupTouchSwipe() {
  let startX = 0;
  let startY = 0;

  document.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (!e.changedTouches || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;

    if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      const mcqActive = document.getElementById('tab-mcq').classList.contains('active');
      const shortActive = document.getElementById('tab-short').classList.contains('active');

      if (mcqActive && state.mcqView === 'focus') {
        stepMcq(dx < 0 ? 1 : -1);
      } else if (shortActive && state.shortView === 'flashcard') {
        stepShortFc(dx < 0 ? 1 : -1);
      }
    }
  }, { passive: true });
}

// ============================================================================
// PHẦN 2: CÂU HỎI NGẮN RÚT GỌN (CLOZE CHẠM MỞ TỪ KHÓA + FLASHCARD + PILLS)
// ============================================================================
function setShortView(v) {
  state.shortView = v;
  document.getElementById('short-view-cloze').classList.toggle('active', v === 'cloze');
  document.getElementById('short-view-flashcard').classList.toggle('active', v === 'flashcard');
  document.getElementById('short-view-compare').classList.toggle('active', v === 'compare');
  document.getElementById('btn-cloze-toggle').style.display = (v === 'cloze') ? 'inline-flex' : 'none';
  renderShortTab();
}

function getFilteredShortList() {
  const f = document.getElementById('short-group-filter').value;
  return shortList.filter(s => {
    if (f === 'g1' || f === 'g2' || f === 'g3') return s.grp === f;
    if (f === 'unmastered') return state.shortStatus[s.id] !== 'mastered';
    return true;
  });
}

function formatClozeHtml(clozeText, openAll) {
  return clozeText.replace(/\{\{(.+?)\}\}/g, (_, word) => {
    const rev = openAll ? 'revealed' : '';
    return `<span class="cloze-token ${rev}" onclick="this.classList.toggle('revealed')">${word}</span>`;
  }).replace(/\n/g, '<br>');
}

function toggleAllCloze() {
  state.allClozeOpen = !state.allClozeOpen;
  document.getElementById('btn-cloze-toggle').textContent = state.allClozeOpen
    ? '🙈 Ẩn lại từ khóa'
    : '👁️ Mở hết từ khóa';
  renderShortTab();
}

function markShort(id, st) {
  if (state.shortStatus[id] === st) delete state.shortStatus[id];
  else state.shortStatus[id] = st;
  saveApp();
  renderShortTab();
}

function renderShortTab() {
  const list = getFilteredShortList();
  const area = document.getElementById('short-content-area');

  if (!list.length) {
    area.innerHTML = `<div class="focus-card" style="text-align:center;">🎉 Bạn đã thuộc hết các câu trong nhóm này!</div>`;
    return;
  }

  if (state.shortView === 'flashcard') {
    if (state.fcShortIdx >= list.length) state.fcShortIdx = 0;
    if (state.fcShortIdx < 0) state.fcShortIdx = list.length - 1;
    const item = list[state.fcShortIdx];
    const st = state.shortStatus[item.id] || '';

    area.innerHTML = `
      <div class="fc-stage">
        <div class="fc-card-modern">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:6px;">
              <span class="q-num-pill">Thẻ ${state.fcShortIdx + 1}/${list.length} • Câu ${item.id}</span>
              <span style="font-size:0.8rem; color:var(--text-muted);">Gồm <strong>${item.pills.length} ý cốt lõi</strong></span>
            </div>
            <div style="font-size:1.12rem; font-weight:800; margin-bottom:16px;">${item.q}</div>

            ${state.fcShortFlipped ? `
              <div class="ultra-short-box" style="margin-bottom:12px;">
                <span class="ultra-label">⚡ Chốt ý nhớ nhanh:</span>
                ${item.pills.map(p => `<span class="pill-kw">${p}</span>`).join('')}
              </div>
              <div class="full-ans-line">
                <strong>📝 Câu đầy đủ viết thi:</strong><br>
                ${formatClozeHtml(item.cloze, true)}
              </div>
              ${item.warn ? `<div class="warning-banner" style="margin-top:10px;">${item.warn}</div>` : ''}
            ` : `
              <div style="padding:32px 16px; text-align:center; background:var(--bg-subtle); border:2px dashed var(--border-strong); border-radius:14px; cursor:pointer;" onclick="flipShortFc()">
                <div style="font-size:1rem; font-weight:700; color:var(--primary);">👆 Chạm để Lật Xem Từ Khóa & Đáp Án</div>
                <div style="font-size:0.82rem; color:var(--text-muted); margin-top:4px;">Hãy tự nhẩm thử ${item.pills.length} ý chính trước khi mở!</div>
              </div>
            `}
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-top:18px; padding-top:14px; border-top:1px solid var(--border);">
            <div style="display:flex; gap:6px;">
              <button class="icon-btn" style="padding:6px 10px; font-size:0.8rem; ${st==='hard'?'border-color:var(--danger);color:var(--danger);':''}" onclick="markShort(${item.id}, 'hard')">🔴 Khó</button>
              <button class="icon-btn" style="padding:6px 10px; font-size:0.8rem; ${st==='mastered'?'background:var(--success);color:#fff;border-color:var(--success);':''}" onclick="markShort(${item.id}, 'mastered')">🟢 Đã thuộc</button>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="icon-btn" style="padding:6px 10px;" onclick="stepShortFc(-1)">⬅️</button>
              <button class="icon-btn" style="padding:6px 12px;" onclick="flipShortFc()">🔄 Lật</button>
              <button class="icon-btn" style="padding:6px 10px; background:var(--primary);color:#fff;border-color:var(--primary);" onclick="stepShortFc(1)">➡️</button>
            </div>
          </div>
        </div>
      </div>
    `;
    return;
  }

  if (state.shortView === 'compare') {
    area.innerHTML = `<div class="short-grid">
      ${list.map(item => {
        const st = state.shortStatus[item.id] || '';
        return `<div class="scard ${st}">
          <div class="scard-head">
            <div class="scard-q">${item.q}</div>
            <div class="scard-actions">
              <button class="icon-btn" style="padding:5px 10px; font-size:0.78rem; ${st==='mastered'?'background:var(--success);color:#fff;':''}" onclick="markShort(${item.id}, 'mastered')">
                ${st === 'mastered' ? '🟢 Đã thuộc' : '⚪ Đánh dấu thuộc'}
              </button>
            </div>
          </div>
          <div class="ultra-short-box">
            <span class="ultra-label">⚡ Chỉ cần nhớ ${item.pills.length} ý:</span>
            ${item.pills.map(p => `<span class="pill-kw">${p}</span>`).join('')}
          </div>
          ${item.warn ? `<div class="warning-banner">${item.warn}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
    return;
  }

  // Default: Cloze Interactive Mode
  area.innerHTML = `<div class="short-grid">
    ${list.map(item => {
      const st = state.shortStatus[item.id] || '';
      return `<div class="scard ${st}">
        <div class="scard-head">
          <div class="scard-q">${item.q}</div>
          <div class="scard-actions" style="display:flex; gap:6px;">
            <button class="icon-btn" style="padding:4px 8px; font-size:0.76rem; ${st==='hard'?'border-color:var(--danger);color:var(--danger);':''}" onclick="markShort(${item.id}, 'hard')">🔴 Khó</button>
            <button class="icon-btn" style="padding:4px 10px; font-size:0.76rem; ${st==='mastered'?'background:var(--success);color:#fff;border-color:var(--success);':''}" onclick="markShort(${item.id}, 'mastered')">
              ${st === 'mastered' ? '🟢 Đã thuộc' : '⚪ Thuộc'}
            </button>
          </div>
        </div>

        <div class="ultra-short-box">
          <span class="ultra-label">⚡ Tóm tắt ${item.pills.length} ý chính:</span>
          ${item.pills.map(p => `<span class="pill-kw">${p}</span>`).join('')}
        </div>

        <div class="full-ans-line">
          <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:6px;">
            🧩 BẢN TỰ DÒ TỪ KHÓA (Chạm vào từng ô vàng để mở):
          </div>
          ${formatClozeHtml(item.cloze, state.allClozeOpen)}
        </div>

        ${item.warn ? `<div class="warning-banner">${item.warn}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function flipShortFc() {
  state.fcShortFlipped = !state.fcShortFlipped;
  renderShortTab();
}

function stepShortFc(d) {
  state.fcShortIdx += d;
  state.fcShortFlipped = false;
  renderShortTab();
}

// ============================================================================
// PHẦN 3: TỰ LUẬN SƠ ĐỒ Ý CHÍNH (CỘT RÚT GỌN 2 PHÚT VS CỘT VIẾT THI)
// ============================================================================
function setEssayMobileCol(mode, btn) {
  state.essayMobileCol = mode;
  document.querySelectorAll('#mobile-essay-tabs .seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEssayTab();
}

function renderEssayTab() {
  const bar = document.getElementById('essay-selector-bar');
  bar.innerHTML = essayList.map(e => {
    const done = !!state.essayRead[e.id];
    const act = state.essayId === e.id;
    return `<button class="e-btn ${act ? 'active' : ''}" onclick="pickEssay(${e.id})">
      <div class="e-btn-num">Câu ${e.id} ${done ? '✅' : ''}</div>
      <div class="e-btn-name">${e.name}</div>
    </button>`;
  }).join('');

  const e = essayList.find(x => x.id === state.essayId);
  const done = !!state.essayRead[e.id];
  const view = document.getElementById('essay-main-view');

  const isMobile = window.innerWidth <= 960;
  const showLeft = !isMobile || state.essayMobileCol === 'both' || state.essayMobileCol === 'mindmap';
  const showRight = !isMobile || state.essayMobileCol === 'both' || state.essayMobileCol === 'text';

  view.innerHTML = `
    <div class="focus-card" style="margin-bottom:16px; padding:16px 18px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div style="font-size:1rem; font-weight:800; flex:1; min-width:220px;">📌 ${e.fullQ}</div>
        <button class="icon-btn" style="font-size:0.8rem; ${done ? 'background:var(--success);color:#fff;border-color:var(--success);' : ''}" onclick="toggleEssayDone(${e.id})">
          ${done ? '✅ Đã thuộc câu này' : '⚪ Đánh dấu đã thuộc'}
        </button>
      </div>
    </div>

    <div class="essay-dual-layout">
      <!-- CỘT TRÁI: BẢN SIÊU RÚT GỌN -->
      <div class="essay-pane" style="display:${showLeft ? 'block' : 'none'};">
        <div class="pane-badge" style="background:var(--primary-soft); color:var(--primary);">
          ⚡ CỘT 1: BẢN SIÊU RÚT GỌN (CHỈ CẦN THUỘC KHUNG NÀY)
        </div>
        <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:14px;">
          Mỗi câu tự luận đã được cô đọng thành các từ khóa ngắn nhất. Nhớ các đầu mục này là nắm trọn 100% ý chính!
        </p>

        ${e.mindmap.map(m => `
          <div class="mindmap-branch">
            <div class="mindmap-title">${m.branch}</div>
            ${m.steps.map((s, idx) => `
              <div class="mini-step">
                <span class="mini-step-num">Ý ${idx + 1}</span>
                <span style="font-weight:600;">${s}</span>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>

      <!-- CỘT PHẢI: BẢN VIẾT VÀO GIẤY THI -->
      <div class="essay-pane" style="display:${showRight ? 'block' : 'none'};">
        <div class="pane-badge" style="background:var(--success-soft); color:var(--success-dark);">
          📝 CỘT 2: CÂU VĂN CÔ ĐỌNG ĐỂ VIẾT VÀO BÀI THI
        </div>
        <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:14px;">
          Chạm vào từng khung để <strong>Che / Mở</strong> khi tự nhẩm bài. Các cụm từ tô vàng là <strong>từ khóa chấm điểm (Barem)</strong>.
        </p>

        ${e.examText.map(sec => `
          <div class="exam-ready-block ${state.maskEssay ? 'masked' : ''}" onclick="this.classList.toggle('masked')" title="Chạm để Ẩn/Hiện nội dung">
            <div style="font-weight:800; font-size:0.94rem; color:var(--text); margin-bottom:8px;">
              ${sec.title}
            </div>
            <div class="exam-ready-body" style="display:flex; flex-direction:column; gap:8px; font-size:0.91rem; color:var(--text-secondary);">
              ${sec.lines.map(line => `<div>${line}</div>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function pickEssay(id) {
  state.essayId = id;
  renderEssayTab();
}

function toggleMaskEssay() {
  state.maskEssay = !state.maskEssay;
  document.getElementById('btn-mask-essay').textContent = state.maskEssay
    ? '👁️ Hiện bài viết'
    : '🙈 Che bài viết để tự nhẩm';
  renderEssayTab();
}

function toggleEssayDone(id) {
  if (state.essayRead[id]) delete state.essayRead[id];
  else state.essayRead[id] = true;
  saveApp();
  renderEssayTab();
}

window.addEventListener('resize', () => {
  if (document.getElementById('tab-essay').classList.contains('active')) {
    renderEssayTab();
  }
});

initApp();
</script>
</body>
</html>
